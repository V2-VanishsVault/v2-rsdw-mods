# Tests: on every push and pull request, each mod whose files changed is syntax-checked and its tests run. A change
# under shared/ (code every mod ships) or tools/ checks every mod.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.pick.outputs.mods }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        name: Which mods changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          all=$(ls mods | jq -R . | jq -cs .)
          # a new branch, or history rewritten: check everything
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mods=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          if echo "$changed" | grep -qE '^(shared|tools|\.github)/'; then
            echo "mods=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mods=$(echo "$changed" | sed -n 's#^mods/\([^/]*\)/.*#\1#p' | sort -u | jq -R . | jq -cs .)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.mods != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.changes.outputs.mods) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -yq lua5.4
      - name: Syntax check
        run: |
          status=0
          while IFS= read -r f; do luac5.4 -p "$f" || status=1; done < <(find "mods/${{ matrix.mod }}" shared -name '*.lua')
          exit $status
      - name: Tests
        working-directory: mods/${{ matrix.mod }}
        run: |
          if [ -f tests/run_tests.lua ]; then lua5.4 tests/run_tests.lua; else echo "no tests yet"; fi
      - name: Builds
        run: bash tools/build.sh "${{ matrix.mod }}" ci
